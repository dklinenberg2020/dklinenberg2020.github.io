name: Update Google Scholar citations

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch citation counts
        run: python scripts/fetch_citations.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- citations.json; then
            echo "No changes to citations.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add citations.json
          git commit -m "chore: update Google Scholar citation counts"
          git push
